<div class="mb-5" [formGroup]="formGroup">
  <label
    [for]="fieldInput.id"
    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
    [ngClass]="fieldInput.error ? 'text-fg-danger-strong' : ''"
  >
    {{ fieldInput.label }}
  </label>
  <input
    [type]="fieldInput.type"
    [name]="fieldInput.name"
    [id]="fieldInput.id"
    class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
    [ngClass]="
      fieldInput.error
        ? 'border-danger-subtle text-fg-danger-strong focus:ring-danger bg-danger-soft'
        : ''
    "
    [placeholder]="fieldInput.placeholder"
    [required]="fieldInput.required"
    [formControlName]="controlName"
  />
  @if (fieldInput.error && fieldInput.errorMessage) {
    <p class="mt-2.5 text-sm text-fg-danger-strong">
      {{ fieldInput.errorMessage }}
    </p>
  }
</div>
